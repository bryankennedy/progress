<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout extend under the iPhone notch/home-bar;
         the safe-area-inset padding in styles.css keeps content clear of them.
         No maximum-scale/user-scalable lock — pinch-zoom stays available for
         accessibility; iOS input auto-zoom is prevented via 16px+ inputs instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Progress</title>

    <!-- Brand mark / app icons (brand-assets/HANDOFF.md) -->
    <link rel="icon" type="image/svg+xml" href="/brand-assets/progress-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand-assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand-assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand-assets/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f7f2" />

    <!-- No-flash theme boot (PROG-150): applies the stored theme preset
         before first paint. Must run before any stylesheet/paint, so it's an
         inline script rather than deferred to main.tsx — the CSP (public/_headers)
         allowlists this exact script by sha256 hash rather than 'unsafe-inline'
         (keeps "no inline scripts except this one, pinned" as the policy).
         Mirrors src/client/theme.ts's THEME_KEY/THEMES.swatch.paper — it can't
         import that module (nothing is bundled yet), so keep the two in sync
         if a theme is added, removed, or recolored. Reads localStorage only;
         everything is try/caught so a storage failure just means "porcelain
         this load", never a broken boot. -->
    <script>
      (function () {
        try {
          var id = window.localStorage.getItem("progress:theme");
          var paper = { adobe: "#f5efe0", sanzo: "#f9f4e9" }[id];
          if (paper) {
            document.documentElement.dataset.theme = id;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", paper);
          }
        } catch (e) {
          /* default this time */
        }
      })();
    </script>

    <!-- iOS standalone PWA: the manifest alone isn't honoured by Safari, so these
         legacy/Apple-specific tags are required for an installed home-screen app.
         - mobile-web-app-capable (+ apple- legacy alias): run without browser chrome.
         - status-bar-style "default": dark text on our light paper status bar
           (black-translucent would draw content under the clock — wrong for a
           light UI). theme-color above tints it #f7f7f2 to match the header.
         - apple-mobile-web-app-title: the home-screen label. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Progress" />

    <!-- Fonts: Spectral (headings/body), IBM Plex Mono (labels/meta/code).
         Self-hosted from /fonts (CR5/PROG-147) — @font-face rules live in
         styles.css. Preload only the two workhorse files (Spectral 400 body,
         Plex Mono 400 labels); the other weights load on demand. `crossorigin`
         is required even same-origin: font fetches are CORS-mode, and a
         mismatched preload would be double-downloaded. -->
    <link rel="preload" href="/fonts/spectral-400.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/ibm-plex-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
